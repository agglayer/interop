# RUSTSEC audit configuration.

[advisories]
ignore = [
    # https://rustsec.org/advisories/RUSTSEC-2024-0437.html
    "RUSTSEC-2024-0437",
    # https://rustsec.org/advisories/RUSTSEC-2025-0009.html
    "RUSTSEC-2025-0009",
    # ansi_term is a transitive dependency from tracing-forest through sp1.
    "RUSTSEC-2021-0139",
    # bincode 1.x is required by the current sp1/agglayer dependency graph.
    "RUSTSEC-2025-0141",
    # derivative is pulled in transitively by ark-ff/ruint.
    "RUSTSEC-2024-0388",
    # number_prefix is pulled in transitively by indicatif through sp1.
    "RUSTSEC-2025-0119",
    # paste is pulled in transitively by alloy and sp1 dependencies.
    "RUSTSEC-2024-0436",
    # rustls-pemfile is pulled in transitively by reqwest and tonic.
    "RUSTSEC-2025-0134",
    # lru is pulled in transitively by alloy-provider and sp1-prover.
    "RUSTSEC-2026-0002",
    # lru 0.12 is pinned by sp1-prover (via sp1-sdk =6.2.2, dev-dependencies
    # only); the patched lru >= 0.18.2 is already used on the alloy-provider
    # path.
    "RUSTSEC-2026-0253",
    # rand is required by the current sp1/alloy/agglayer dependency graph.
    "RUSTSEC-2026-0097",
    # https://rustsec.org/advisories/RUSTSEC-2026-0344.html
    # ruzstd decompression bomb, fixed in ruzstd >= 0.9.1. ruzstd comes only
    # from object 0.37, whose consumers (backtrace 0.3.76, sp1-core-executor
    # 6.9.0) require ^0.37. object uses it only for compressed ELF sections,
    # and the only ELFs parsed are our own SP1 programs and the running
    # binary.
    "RUSTSEC-2026-0344",
    # https://rustsec.org/advisories/RUSTSEC-2026-0387.html
    # crypto-bigint timing leaks, fixed in 0.7.6. We use 0.5, through
    # elliptic-curve 0.13 (alloy 2.x, sp1). These crates never handle
    # secret keys, and 0.5 has no subtraction branch (it came in 0.7).
    "RUSTSEC-2026-0387"
]
